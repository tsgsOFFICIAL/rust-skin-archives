<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img">
  <title>Rust Skin Viewer Wordmark</title>
  <desc>Horizontal wordmark with RUST in bold rust red and SKIN ARCHIVES in monospace beneath</desc>

  <!-- plate -->
  <rect width="600" height="220" rx="4" fill="#1a1a1a"/>

  <!-- top rust bar -->
  <rect x="0" y="0" width="600" height="5" rx="2" fill="#c0392b"/>

  <!-- diagonal slash bg -->
  <polygon points="0,120 90,0 300,0 300,90" fill="#1f1010" opacity="0.7"/>

  <!-- RUST — shadow layer -->
  <text x="20" y="148"
    font-family="'Barlow Condensed','Arial Narrow',sans-serif"
    font-size="130"
    font-weight="900"
    letter-spacing="0.06em"
    fill="none"
    stroke="#7d1a10"
    stroke-width="4"
    opacity="0.35">RUST</text>

  <!-- RUST — main -->
  <text x="20" y="148"
    font-family="'Barlow Condensed','Arial Narrow',sans-serif"
    font-size="130"
    font-weight="900"
    letter-spacing="0.06em"
    fill="#c0392b">RUST</text>

  <!-- SKIN ARCHIVES -->
  <text x="22" y="178"
    font-family="'Share Tech Mono','Courier New',monospace"
    font-size="18"
    letter-spacing="0.45em"
    fill="#6b6058">SKIN ARCHIVES</text>

  <!-- separator -->
  <line x1="20" y1="188" x2="580" y2="188" stroke="#3a3a3a" stroke-width="0.8"/>

  <!-- scratches -->
  <line x1="540" y1="195" x2="578" y2="204" stroke="#3a2020" stroke-width="1.5" opacity="0.6"/>
  <line x1="10"  y1="200" x2="35"  y2="206" stroke="#3a2020" stroke-width="1" opacity="0.5"/>

  <!-- rivets -->
  <circle cx="14"  cy="14"  r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>
  <circle cx="586" cy="14"  r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>
  <circle cx="14"  cy="206" r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>
  <circle cx="586" cy="206" r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>

  <!-- bottom rust bleed -->
  <rect x="0" y="215" width="600" height="3" rx="1" fill="#7d1a10" opacity="0.6"/>
</svg>
