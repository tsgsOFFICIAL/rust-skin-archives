<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img">
  <title>Rust Skin Viewer Icon</title>
  <desc>Square icon with a bold geometric R on a dark steel plate with rust red accents</desc>

  <!-- plate -->
  <rect width="220" height="220" rx="4" fill="#1a1a1a"/>

  <!-- top rust bar -->
  <rect x="0" y="0" width="220" height="5" rx="2" fill="#c0392b"/>

  <!-- diagonal slash bg -->
  <polygon points="0,130 110,0 220,0 0,220" fill="#1f1010" opacity="0.9"/>

  <!-- R — vertical stem -->
  <rect x="48" y="45" width="18" height="110" rx="2" fill="#c0392b"/>
  <!-- R — top bar -->
  <rect x="48" y="45" width="72" height="16" rx="2" fill="#c0392b"/>
  <!-- R — mid bar -->
  <rect x="48" y="93" width="64" height="14" rx="2" fill="#c0392b"/>
  <!-- R — bump -->
  <path d="M120,45 A32,32 0 0,1 120,107" fill="none" stroke="#c0392b" stroke-width="16" stroke-linecap="butt"/>
  <!-- R — leg -->
  <polygon points="110,107 136,107 166,155 146,155" fill="#c0392b"/>

  <!-- scratches -->
  <line x1="30" y1="28" x2="55" y2="35" stroke="#3a2020" stroke-width="1.5" opacity="0.7"/>
  <line x1="170" y1="180" x2="198" y2="190" stroke="#3a2020" stroke-width="1.5" opacity="0.7"/>
  <line x1="180" y1="20" x2="210" y2="14" stroke="#3a2020" stroke-width="1" opacity="0.5"/>

  <!-- rivets -->
  <circle cx="14"  cy="14"  r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>
  <circle cx="206" cy="14"  r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>
  <circle cx="14"  cy="206" r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>
  <circle cx="206" cy="206" r="4" fill="#2e2e2e" stroke="#555" stroke-width="0.8"/>

  <!-- bottom rust bleed -->
  <rect x="0" y="215" width="220" height="3" rx="1" fill="#7d1a10" opacity="0.6"/>
</svg>
