name: Update prices

# updates docs/prices.json (steam market prices) every 8 hours and commits it if it changed
# only needs docs/skins.json, no textures or models
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

# one run at a time
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch prices
        # exit code 1 is a partial run (rate limited), it still saved what it got so don't fail the job
        run: dotnet run --project pipeline/PriceFetcher -c Release -- --skins docs/skins.json --out docs/prices.json
        continue-on-error: true

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/prices.json; then
            echo "No price changes."
          else
            timestamp=$(date -u '+%Y-%m-%d %H:%M UTC')
            sed -i "s|Last price update: .*|Last price update: ${timestamp}|" README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/prices.json README.md
            git commit -m "Update prices - ${timestamp}"
            git push
          fi
